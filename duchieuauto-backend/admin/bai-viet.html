<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Bài Viết | Quản Trị Đức Hiếu Auto</title>
    <link rel="stylesheet" href="assets/admin.css">
</head>
<body>
    <div class="admin-topbar" id="adminTopbar"></div>

    <main class="admin-main">
        <div class="admin-header">
            <div>
                <h1>Bài Viết</h1>
                <p class="desc">Quản lý bài viết Tin Tức - tạo mới, sửa, xoá, đăng/ẩn.</p>
            </div>
            <a href="bai-viet-form.html" class="btn btn-primary">+ Viết Bài Mới</a>
        </div>

        <div class="bulk-toolbar" id="bulkToolbar" hidden style="display:flex;align-items:center;gap:12px;background:var(--bg-alt);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 16px;margin-bottom:12px;">
            <span id="bulkCount" style="font-size:13.5px;font-weight:600;"></span>
            <button type="button" class="btn btn-secondary" id="bulkPublishBtn">Đăng Đã Chọn</button>
            <button type="button" class="btn btn-secondary" id="bulkUnpublishBtn">Chuyển Nháp</button>
            <button type="button" class="btn btn-danger" id="bulkDeleteBtn">Xoá Đã Chọn</button>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th style="width:32px;"><input type="checkbox" id="selectAllCheck"></th>
                    <th>Tiêu đề</th>
                    <th>Danh mục</th>
                    <th>Trạng thái</th>
                    <th>Cập nhật</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="postsBody">
                <tr class="empty-row"><td colspan="6">Đang tải...</td></tr>
            </tbody>
        </table>
    </main>

    <script src="assets/admin.js"></script>
    <script>
        const auth = requireAuth(["content", "super_admin"]);
        if (auth) {
            renderAdminNav(auth, "bai-viet");
            loadPosts();

            document.getElementById("selectAllCheck").addEventListener("change", (e) => {
                document.querySelectorAll(".row-check").forEach(c => { c.checked = e.target.checked; });
                updateBulkToolbar();
            });
            document.getElementById("bulkPublishBtn").addEventListener("click", () => bulkSetPublished(true));
            document.getElementById("bulkUnpublishBtn").addEventListener("click", () => bulkSetPublished(false));
            document.getElementById("bulkDeleteBtn").addEventListener("click", bulkDelete);
        }

        async function loadPosts() {
            const res = await apiFetch("/api/posts/admin/all");
            const posts = await res.json();
            const tbody = document.getElementById("postsBody");

            document.getElementById("selectAllCheck").checked = false;
            updateBulkToolbar();

            if (posts.length === 0) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="6">Chưa có bài viết nào. Bấm "+ Viết Bài Mới" để bắt đầu.</td></tr>`;
                return;
            }

            tbody.innerHTML = posts.map(p => `
                <tr>
                    <td><input type="checkbox" class="row-check" data-id="${p.id}"></td>
                    <td>${p.title}</td>
                    <td>${p.category || "-"}</td>
                    <td><span class="badge ${p.published ? "badge-published" : "badge-draft"}">${p.published ? "Đã đăng" : "Bản nháp"}</span></td>
                    <td>${formatDateTime(p.updated_at)}</td>
                    <td class="actions">
                        <a href="bai-viet-form.html?id=${p.id}" class="btn btn-secondary">Sửa</a>
                        <button type="button" class="btn btn-danger" data-delete="${p.id}" data-title="${p.title.replace(/"/g, "&quot;")}">Xoá</button>
                    </td>
                </tr>
            `).join("");

            tbody.querySelectorAll("[data-delete]").forEach(btn => {
                btn.addEventListener("click", () => deletePost(btn.dataset.delete, btn.dataset.title));
            });
            tbody.querySelectorAll(".row-check").forEach(c => {
                c.addEventListener("change", updateBulkToolbar);
            });
        }

        async function deletePost(id, title) {
            if (!confirm(`Xoá bài viết "${title}"? Không thể hoàn tác.`)) return;
            try {
                const res = await apiFetch(`/api/posts/${id}`, { method: "DELETE" });
                if (!res.ok) throw new Error((await res.json()).error || "Xoá thất bại");
                showToast("Đã xoá bài viết");
                loadPosts();
            } catch (err) {
                showToast(err.message, true);
            }
        }

        function getSelectedIds() {
            return Array.from(document.querySelectorAll(".row-check:checked")).map(c => c.dataset.id);
        }

        function updateBulkToolbar() {
            const ids = getSelectedIds();
            const toolbar = document.getElementById("bulkToolbar");
            toolbar.hidden = ids.length === 0;
            document.getElementById("bulkCount").textContent = `Đã chọn ${ids.length} bài viết`;
        }

        async function bulkSetPublished(published) {
            const ids = getSelectedIds();
            if (ids.length === 0) return;
            if (!confirm(`${published ? "Đăng" : "Chuyển về nháp"} ${ids.length} bài viết đã chọn?`)) return;
            try {
                await Promise.all(ids.map(id => apiFetch(`/api/posts/${id}`, { method: "PUT", body: { published } })));
                showToast(`Đã ${published ? "đăng" : "chuyển nháp"} ${ids.length} bài viết`);
                loadPosts();
            } catch (err) {
                showToast(err.message, true);
            }
        }

        async function bulkDelete() {
            const ids = getSelectedIds();
            if (ids.length === 0) return;
            if (!confirm(`Xoá ${ids.length} bài viết đã chọn? Không thể hoàn tác.`)) return;
            try {
                await Promise.all(ids.map(id => apiFetch(`/api/posts/${id}`, { method: "DELETE" })));
                showToast(`Đã xoá ${ids.length} bài viết`);
                loadPosts();
            } catch (err) {
                showToast(err.message, true);
            }
        }
    </script>
</body>
</html>
