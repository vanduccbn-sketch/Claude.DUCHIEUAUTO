<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Liên Hệ / Đặt Lịch | Quản Trị Đức Hiếu Auto</title>
    <link rel="stylesheet" href="assets/admin.css">
</head>
<body>
    <div class="admin-topbar" id="adminTopbar"></div>

    <main class="admin-main">
        <div class="admin-header">
            <div>
                <h1>Liên Hệ / Đặt Lịch</h1>
                <p class="desc">Danh sách khách để lại thông tin qua form liên hệ và đặt lịch hẹn trên website.</p>
            </div>
            <button type="button" class="btn btn-secondary" id="exportCsvBtn">Xuất CSV</button>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>Loại</th>
                    <th>Khách hàng</th>
                    <th>SĐT</th>
                    <th>Dịch vụ</th>
                    <th>Thời gian gửi</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="contactsBody">
                <tr class="empty-row"><td colspan="7">Đang tải...</td></tr>
            </tbody>
        </table>
    </main>

    <script src="assets/admin.js"></script>
    <script>
        const auth = requireAuth();
        if (auth) {
            renderAdminNav(auth, "lien-he");
            loadContacts();
            document.getElementById("exportCsvBtn").addEventListener("click", exportCsv);
        }

        const STATUS_LABEL = { new: "Mới", contacted: "Đã liên hệ", done: "Hoàn tất" };
        const TYPE_LABEL = { booking: "Đặt lịch", maintenance: "Nhắc bảo dưỡng", contact: "Liên hệ" };
        let lastContacts = [];

        async function loadContacts() {
            const res = await apiFetch("/api/contacts");
            const contacts = await res.json();
            lastContacts = contacts;
            const tbody = document.getElementById("contactsBody");

            if (contacts.length === 0) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="7">Chưa có liên hệ nào.</td></tr>`;
                return;
            }

            tbody.innerHTML = contacts.map(c => `
                <tr>
                    <td>${TYPE_LABEL[c.type] || "Liên hệ"}</td>
                    <td>${c.name}${c.message ? `<div class="form-hint">${c.message}</div>` : ""}</td>
                    <td><a href="tel:${c.phone}">${c.phone}</a></td>
                    <td>${c.service || "-"}${c.preferred_date ? `<div class="form-hint">${c.preferred_date} ${c.preferred_time || ""}</div>` : ""}</td>
                    <td>${formatDateTime(c.created_at)}</td>
                    <td>
                        <select class="status-select" data-id="${c.id}">
                            <option value="new" ${c.status === "new" ? "selected" : ""}>Mới</option>
                            <option value="contacted" ${c.status === "contacted" ? "selected" : ""}>Đã liên hệ</option>
                            <option value="done" ${c.status === "done" ? "selected" : ""}>Hoàn tất</option>
                        </select>
                    </td>
                    <td class="actions">
                        <button type="button" class="btn btn-danger" data-delete-id="${c.id}">Xoá</button>
                    </td>
                </tr>
            `).join("");

            tbody.querySelectorAll(".status-select").forEach(sel => {
                sel.addEventListener("change", () => updateStatus(sel.dataset.id, sel.value));
            });
            tbody.querySelectorAll("[data-delete-id]").forEach(btn => {
                btn.addEventListener("click", () => deleteContact(btn.dataset.deleteId));
            });
        }

        async function updateStatus(id, status) {
            try {
                const res = await apiFetch(`/api/contacts/${id}/status`, { method: "PUT", body: { status } });
                if (!res.ok) throw new Error((await res.json()).error || "Cập nhật thất bại");
                showToast("Đã cập nhật trạng thái");
            } catch (err) {
                showToast(err.message, true);
            }
        }

        async function deleteContact(id) {
            if (!confirm("Xoá liên hệ này? Không thể hoàn tác.")) return;
            try {
                const res = await apiFetch(`/api/contacts/${id}`, { method: "DELETE" });
                if (!res.ok) throw new Error((await res.json()).error || "Xoá thất bại");
                showToast("Đã xoá");
                loadContacts();
            } catch (err) {
                showToast(err.message, true);
            }
        }

        // Dùng ";" thay vì "," (Excel bản tiếng Việt mặc định coi ";" là dấu phân cách cột) + BOM
        // UTF-8 đầu file để không lỗi font tiếng Việt khi mở bằng Excel - giống cách làm ở san-pham.html.
        function exportCsv() {
            if (lastContacts.length === 0) return showToast("Không có dữ liệu để xuất", true);
            const rows = [["Loại", "Khách hàng", "SĐT", "Dịch vụ", "Ngày hẹn", "Giờ hẹn", "Ghi chú", "Thời gian gửi", "Trạng thái"]];
            lastContacts.forEach(c => {
                rows.push([
                    TYPE_LABEL[c.type] || "Liên hệ", c.name, c.phone, c.service || "",
                    c.preferred_date || "", c.preferred_time || "", c.message || "",
                    formatDateTime(c.created_at), STATUS_LABEL[c.status] || c.status
                ]);
            });
            const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\r\n");
            const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `lien-he-${new Date().toISOString().slice(0, 10)}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }
    </script>
</body>
</html>
