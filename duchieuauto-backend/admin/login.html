<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Đăng Nhập Quản Trị | Đức Hiếu Auto</title>
    <link rel="stylesheet" href="assets/admin.css">
</head>
<body>
    <div class="login-page">
        <div class="login-box">
            <h1>Đức Hiếu Auto</h1>
            <p class="sub">Đăng nhập trang quản trị nội dung</p>

            <form id="loginForm">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" name="username" autocomplete="username" required>

                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <div class="login-error" id="loginError"></div>

                <button type="submit" id="submitBtn">Đăng Nhập</button>
            </form>
            <p style="text-align:center;margin-top:16px;font-size:13px;"><a href="quen-mat-khau.html">Quên mật khẩu?</a></p>
        </div>
    </div>

    <script src="assets/admin.js"></script>
    <script>
        // Nếu đã đăng nhập sẵn, vào thẳng dashboard
        if (getAuth()) window.location.href = "dashboard.html";

        const form = document.getElementById("loginForm");
        const errorBox = document.getElementById("loginError");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorBox.classList.remove("show");
            submitBtn.disabled = true;
            submitBtn.textContent = "Đang đăng nhập...";

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("username").value.trim(),
                        password: document.getElementById("password").value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Đăng nhập thất bại");

                setAuth(data);
                window.location.href = "dashboard.html";
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.add("show");
                submitBtn.disabled = false;
                submitBtn.textContent = "Đăng Nhập";
            }
        });
    </script>
</body>
</html>
