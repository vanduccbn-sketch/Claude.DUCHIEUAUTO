<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Quên Mật Khẩu | Đức Hiếu Auto</title>
    <link rel="stylesheet" href="assets/admin.css">
</head>
<body>
    <div class="login-page">
        <div class="login-box">
            <h1>Quên Mật Khẩu</h1>
            <p class="sub">Nhập tên đăng nhập hoặc email, hệ thống sẽ gửi link đặt lại mật khẩu qua email (nếu tài khoản có email).</p>

            <form id="forgotForm">
                <label for="username">Tên đăng nhập hoặc email</label>
                <input type="text" id="username" name="username" autocomplete="username" required>

                <div class="login-error" id="errorBox"></div>
                <div class="login-error" id="successBox" style="background:#eafaf1;color:#27ae60;"></div>

                <button type="submit" id="submitBtn">Gửi Yêu Cầu</button>
            </form>
            <p style="text-align:center;margin-top:16px;font-size:13px;">
                <a href="login.html">← Quay lại đăng nhập</a>
            </p>
        </div>
    </div>

    <script src="assets/admin.js"></script>
    <script>
        const form = document.getElementById("forgotForm");
        const errorBox = document.getElementById("errorBox");
        const successBox = document.getElementById("successBox");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorBox.classList.remove("show");
            successBox.classList.remove("show");
            submitBtn.disabled = true;
            submitBtn.textContent = "Đang gửi...";

            try {
                const res = await fetch("/api/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: document.getElementById("username").value.trim() })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Gửi yêu cầu thất bại");

                successBox.textContent = data.message;
                successBox.classList.add("show");
                form.reset();
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.add("show");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Gửi Yêu Cầu";
            }
        });
    </script>
</body>
</html>
