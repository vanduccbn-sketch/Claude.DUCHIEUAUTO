<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sản Phẩm | Quản Trị Đức Hiếu Auto</title>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        .spec-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-bottom: 10px; }
        .spec-row input { padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; font-size: 13.5px; }
        .inline-add { display: flex; gap: 8px; margin-top: 8px; }
        .inline-add input { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="admin-topbar" id="adminTopbar"></div>

    <main class="admin-main">
        <div class="admin-header">
            <div>
                <h1 id="formTitle">Thêm Sản Phẩm</h1>
                <p class="desc">Chọn đúng danh mục/thương hiệu trước khi điền các phần còn lại.</p>
            </div>
            <a href="san-pham.html" class="btn btn-secondary">← Quay Lại Danh Sách</a>
        </div>

        <div class="editor-layout">
            <div class="editor-main">
                <div class="form-group">
                    <label for="name">Tên sản phẩm *</label>
                    <input type="text" id="name" placeholder="VD: JBL Club 605CSQ">
                </div>
                <div class="form-group">
                    <label for="price">Giá</label>
                    <input type="text" id="price" placeholder="VD: 8.600.000₫ hoặc Liên hệ">
                </div>
                <div class="form-group">
                    <label for="description">Mô tả</label>
                    <textarea id="description" rows="6" placeholder="Mô tả chi tiết sản phẩm..."></textarea>
                </div>

                <div class="form-group">
                    <label>Thông số kỹ thuật</label>
                    <div id="specsList"></div>
                    <button type="button" class="btn btn-secondary" id="addSpecBtn">+ Thêm dòng thông số</button>
                </div>
            </div>

            <div class="editor-side">
                <div class="form-group">
                    <label>Ảnh sản phẩm</label>
                    <div class="cover-preview" id="imagePreview">Chưa có ảnh (dùng ảnh mặc định theo mã sản phẩm)</div>
                    <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none;">
                    <button type="button" class="btn btn-secondary" id="imageBtn" style="width:100%;">Chọn Ảnh</button>
                    <input type="hidden" id="imageUrl">
                    <p class="form-hint">Để trống nếu sản phẩm đã có sẵn ảnh tĩnh theo mã sản phẩm.</p>
                </div>

                <div class="form-group">
                    <label for="category">Danh mục *</label>
                    <select id="category">
                        <option value="">-- Chọn danh mục --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="brand">Thương hiệu / Nhóm sản phẩm *</label>
                    <select id="brand">
                        <option value="">-- Chọn danh mục trước --</option>
                    </select>
                    <div class="inline-add">
                        <input type="text" id="newBrandName" placeholder="Tên thương hiệu mới...">
                        <button type="button" class="btn btn-secondary" id="addBrandBtn">+ Thêm</button>
                    </div>
                </div>

                <div class="form-group" id="typeGroup" hidden>
                    <label for="brandType">Loại / Thương hiệu con</label>
                    <select id="brandType">
                        <option value="">-- Không phân loại --</option>
                    </select>
                    <div class="inline-add">
                        <input type="text" id="newTypeName" placeholder="Tên loại mới...">
                        <button type="button" class="btn btn-secondary" id="addTypeBtn">+ Thêm</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Trạng thái</label>
                    <div class="toggle-row">
                        <input type="checkbox" id="hiddenToggle" style="width:auto;">
                        <label for="hiddenToggle" style="margin:0;font-weight:normal;">Ẩn sản phẩm này khỏi trang công khai</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="editor-actions">
            <button type="button" class="btn btn-primary" id="saveBtn">Lưu Sản Phẩm</button>
            <span class="save-status" id="saveStatus"></span>
        </div>
    </main>

    <script src="assets/admin.js"></script>
    <script>
        const auth = requireAuth(["content", "super_admin"]);
        let categoriesData = [];
        let productId = null;

        if (auth) {
            renderAdminNav(auth, "san-pham");
            init();
        }

        async function init() {
            await loadCategories();

            const params = new URLSearchParams(window.location.search);
            productId = params.get("id");
            if (productId) await loadExistingProduct(productId);

            document.getElementById("category").addEventListener("change", () => {
                populateBrandSelect();
                populateTypeSelect();
            });
            document.getElementById("brand").addEventListener("change", populateTypeSelect);
            document.getElementById("addSpecBtn").addEventListener("click", () => addSpecRow("", ""));
            document.getElementById("addBrandBtn").addEventListener("click", addNewBrand);
            document.getElementById("addTypeBtn").addEventListener("click", addNewType);
            document.getElementById("imageBtn").addEventListener("click", () => document.getElementById("imageInput").click());
            document.getElementById("imageInput").addEventListener("change", uploadImage);
            document.getElementById("saveBtn").addEventListener("click", saveProduct);

            if (!productId) addSpecRow("", "");
        }

        async function loadCategories() {
            const res = await apiFetch("/api/products/admin/categories");
            categoriesData = await res.json();
            const sel = document.getElementById("category");
            sel.innerHTML = `<option value="">-- Chọn danh mục --</option>` +
                categoriesData.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
        }

        function populateBrandSelect(selectedBrandId) {
            const catId = document.getElementById("category").value;
            const cat = categoriesData.find(c => c.id === catId);
            const sel = document.getElementById("brand");
            if (!cat) {
                sel.innerHTML = `<option value="">-- Chọn danh mục trước --</option>`;
                return;
            }
            sel.innerHTML = `<option value="">-- Chọn thương hiệu --</option>` +
                cat.brands.map(b => `<option value="${b.id}" ${b.id === selectedBrandId ? "selected" : ""}>${b.name}</option>`).join("");
        }

        function populateTypeSelect(selectedTypeId) {
            const catId = document.getElementById("category").value;
            const brandId = document.getElementById("brand").value;
            const cat = categoriesData.find(c => c.id === catId);
            const brand = cat ? cat.brands.find(b => b.id === brandId) : null;
            const typeGroup = document.getElementById("typeGroup");
            const sel = document.getElementById("brandType");

            if (!brand) { typeGroup.hidden = true; sel.innerHTML = ""; return; }

            typeGroup.hidden = false;
            sel.innerHTML = `<option value="">-- Không phân loại --</option>` +
                brand.types.map(t => `<option value="${t.id}" ${t.id === selectedTypeId ? "selected" : ""}>${t.name}</option>`).join("");
        }

        async function addNewBrand() {
            const catId = document.getElementById("category").value;
            const name = document.getElementById("newBrandName").value.trim();
            if (!catId) return showToast("Chọn danh mục trước", true);
            if (!name) return showToast("Nhập tên thương hiệu mới", true);

            try {
                const res = await apiFetch("/api/products/admin/brands", { method: "POST", body: { category_id: catId, name } });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Thêm thất bại");
                await loadCategories();
                document.getElementById("category").value = catId;
                populateBrandSelect(data.id);
                document.getElementById("newBrandName").value = "";
                showToast(`Đã thêm thương hiệu "${name}"`);
            } catch (err) {
                showToast(err.message, true);
            }
        }

        async function addNewType() {
            const catId = document.getElementById("category").value;
            const brandId = document.getElementById("brand").value;
            const name = document.getElementById("newTypeName").value.trim();
            if (!brandId) return showToast("Chọn thương hiệu trước", true);
            if (!name) return showToast("Nhập tên loại mới", true);

            try {
                const res = await apiFetch("/api/products/admin/brand-types", { method: "POST", body: { category_id: catId, brand_id: brandId, name } });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Thêm thất bại");
                await loadCategories();
                document.getElementById("category").value = catId;
                populateBrandSelect(brandId);
                populateTypeSelect(data.id);
                document.getElementById("newTypeName").value = "";
                showToast(`Đã thêm loại "${name}"`);
            } catch (err) {
                showToast(err.message, true);
            }
        }

        function addSpecRow(key, value) {
            const list = document.getElementById("specsList");
            const row = document.createElement("div");
            row.className = "spec-row";
            row.innerHTML = `
                <input type="text" class="spec-key" placeholder="Tên thông số (VD: Bảo hành)" value="${key || ""}">
                <input type="text" class="spec-value" placeholder="Giá trị (VD: 12 tháng)" value="${value || ""}">
                <button type="button" class="btn btn-danger spec-remove">Xoá</button>
            `;
            row.querySelector(".spec-remove").addEventListener("click", () => row.remove());
            list.appendChild(row);
        }

        function collectSpecs() {
            return Array.from(document.querySelectorAll(".spec-row")).map(row => [
                row.querySelector(".spec-key").value.trim(),
                row.querySelector(".spec-value").value.trim()
            ]).filter(([k]) => k);
        }

        async function uploadImage() {
            const file = document.getElementById("imageInput").files[0];
            if (!file) return;
            const btn = document.getElementById("imageBtn");
            btn.disabled = true;
            btn.textContent = "Đang tải lên...";
            try {
                const fd = new FormData();
                fd.append("image", file);
                const res = await apiFetch("/api/uploads", { method: "POST", body: fd });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Tải ảnh thất bại");
                document.getElementById("imageUrl").value = data.url;
                document.getElementById("imagePreview").innerHTML = `<img src="${data.url}" alt="">`;
            } catch (err) {
                showToast(err.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = "Chọn Ảnh";
            }
        }

        async function loadExistingProduct(id) {
            document.getElementById("formTitle").textContent = "Sửa Sản Phẩm";
            try {
                const res = await apiFetch(`/api/products/admin/id/${id}`);
                if (!res.ok) throw new Error("Không tìm thấy sản phẩm");
                const p = await res.json();

                document.getElementById("name").value = p.name;
                document.getElementById("price").value = p.price || "";
                document.getElementById("description").value = p.description || "";
                document.getElementById("hiddenToggle").checked = !!p.hidden;
                document.getElementById("category").value = p.category_id;
                populateBrandSelect(p.brand_id);
                populateTypeSelect(p.brand_type_id);

                if (p.image) {
                    document.getElementById("imageUrl").value = p.image;
                    document.getElementById("imagePreview").innerHTML = `<img src="${p.image}" alt="">`;
                } else {
                    document.getElementById("imagePreview").innerHTML = `<img src="../assets/images/products/${p.id}/anh-1.jpg" alt="" onerror="this.parentElement.textContent='Chưa có ảnh (dùng ảnh mặc định theo mã sản phẩm)'">`;
                }

                document.getElementById("specsList").innerHTML = "";
                (p.specs || []).forEach(([k, v]) => addSpecRow(k, v));
                if (!p.specs || p.specs.length === 0) addSpecRow("", "");
            } catch (err) {
                showToast(err.message, true);
            }
        }

        async function saveProduct() {
            const name = document.getElementById("name").value.trim();
            const categoryId = document.getElementById("category").value;
            const brandId = document.getElementById("brand").value;
            if (!name) return showToast("Vui lòng nhập tên sản phẩm", true);
            if (!categoryId) return showToast("Vui lòng chọn danh mục", true);
            if (!brandId) return showToast("Vui lòng chọn thương hiệu", true);

            const payload = {
                name,
                category_id: categoryId,
                brand_id: brandId,
                brand_type_id: document.getElementById("brandType").value || null,
                price: document.getElementById("price").value.trim() || null,
                description: document.getElementById("description").value.trim() || null,
                image: document.getElementById("imageUrl").value || null,
                hidden: document.getElementById("hiddenToggle").checked,
                specs: collectSpecs()
            };

            const saveBtn = document.getElementById("saveBtn");
            saveBtn.disabled = true;
            saveBtn.textContent = "Đang lưu...";
            try {
                const res = productId
                    ? await apiFetch(`/api/products/${productId}`, { method: "PUT", body: payload })
                    : await apiFetch("/api/products", { method: "POST", body: payload });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Lưu thất bại");

                showToast("Đã lưu sản phẩm thành công");
                document.getElementById("saveStatus").textContent = "Đã lưu lúc " + new Date().toLocaleTimeString("vi-VN");
                if (!productId && data.id) {
                    productId = data.id;
                    window.history.replaceState(null, "", `san-pham-form.html?id=${data.id}`);
                    document.getElementById("formTitle").textContent = "Sửa Sản Phẩm";
                }
            } catch (err) {
                showToast(err.message, true);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = "Lưu Sản Phẩm";
            }
        }
    </script>
</body>
</html>
