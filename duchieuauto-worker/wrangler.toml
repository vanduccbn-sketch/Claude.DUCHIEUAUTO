name = "duchieuauto-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Biến không nhạy cảm (secret thật như JWT_SECRET/TURSO_AUTH_TOKEN đặt qua `wrangler secret put`,
# không ghi trực tiếp ở đây - tránh lộ khi commit lên git, đúng nguyên tắc đã áp dụng cho .env cũ).
[vars]
FRONTEND_ORIGIN = "https://duchieuauto.vn"
ADMIN_BASE_URL = "https://admin.duchieuauto.vn/admin"

# KV namespace cho khoá đăng nhập sai (Phase 13.2).
[[kv_namespaces]]
binding = "BRUTE_FORCE_KV"
id = "66a47422a1104075aa39247ea04ecd14"

# Static assets cho trang quản trị (Phase 13.8) - thay cho express.static("/admin") ở bản gốc.
# Không set binding riêng: mặc định Workers Assets tự phục vụ file tĩnh khớp đường dẫn TRƯỚC khi
# rơi vào code Worker (route "/", "/robots.txt" trong src/index.js không bị assets che vì không
# trùng đường dẫn file tĩnh nào trong public/).
[assets]
directory = "./public"
