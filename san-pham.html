<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đang chuyển hướng...</title>
    <!-- Trang này đổi tên thành product.html (URL sạch /product, không lộ .html) - giữ lại file
         này chỉ để chuyển hướng link/bookmark cũ trỏ tới "san-pham.html", tránh mất khách/mất điểm
         SEO đã có. Giữ nguyên query string (VD ?category=...) khi chuyển hướng. -->
    <link rel="canonical" href="https://duchieuauto.vn/product">
    <meta http-equiv="refresh" content="0; url=/product">
    <script>location.replace("/product" + location.search + location.hash);</script>
</head>
<body>
    <p>Trang đã chuyển sang <a href="/product">/product</a>...</p>
</body>
</html>
